[package]
name = "ototune"
version = "0.2.0"
edition = "2021"
authors = ["Praveen Senpai"]
description = "Minimal aesthetic Rust TUI MPD player tailored for daily listening and AJATT audio immersion"
repository = "https://github.com/Praveensenpai/ototune"
homepage = "https://github.com/Praveensenpai/ototune"
license = "MIT"
keywords = ["mpd", "tui", "ratatui", "immersion", "audio-player"]
categories = ["command-line-utilities", "multimedia::audio"]
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
mpd = "0.1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
unicode-width = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
