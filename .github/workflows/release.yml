name: Release Linux Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Asset
        run: |
          mkdir -p dist
          cp target/release/ototune dist/
          tar -czvf ototune-linux-x86_64.tar.gz -C dist ototune

      - name: Upload Release Artifact to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "ototune ${{ github.ref_name }}"
          generate_release_notes: true
          files: ototune-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
